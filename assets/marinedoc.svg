<text x="48" y="62" class="mono" font-size="13" letter-spacing="2"><tspan fill="#5B8CFF" font-weight="700">03 · RAG PLATFORM</tspan><tspan dx="9" fill="#8A97AB">·&#160;WOW CARD</tspan></text><text x="48" y="108" class="sans" font-size="36" font-weight="800" fill="#EEF2F8">MarineDoc</text><text x="48" y="144" class="sans" font-size="16" fill="#B4C0D0">Multi-tenant RAG for ship manuals with</text><text x="48" y="168" class="sans" font-size="16" fill="#B4C0D0">page-level citations. Keeps working with</text><text x="48" y="192" class="sans" font-size="16" fill="#B4C0D0">no internet, and even with no server.</text><rect x="48" y="234" width="66" height="26" rx="13" fill="#131B2B" stroke="#26324A"/><text x="81" y="251" text-anchor="middle" class="mono" font-size="12" fill="#B4C0D0">Qdrant</text><rect x="121.8" y="234" width="51" height="26" rx="13" fill="#131B2B" stroke="#26324A"/><text x="147" y="251" text-anchor="middle" class="mono" font-size="12" fill="#B4C0D0">BM25</text><rect x="181.0" y="234" width="73" height="26" rx="13" fill="#131B2B" stroke="#26324A"/><text x="218" y="251" text-anchor="middle" class="mono" font-size="12" fill="#B4C0D0">FastAPI</text><rect x="262.1" y="234" width="80" height="26" rx="13" fill="#131B2B" stroke="#26324A"/><text x="302" y="251" text-anchor="middle" class="mono" font-size="12" fill="#B4C0D0">Supabase</text><rect x="48" y="270" width="110" height="26" rx="13" fill="#131B2B" stroke="#26324A"/><text x="103" y="287" text-anchor="middle" class="mono" font-size="12" fill="#B4C0D0">React Native</text><rect x="165.6" y="270" width="51" height="26" rx="13" fill="#131B2B" stroke="#26324A"/><text x="191" y="287" text-anchor="middle" class="mono" font-size="12" fill="#B4C0D0">ONNX</text><line x1="430" y1="40" x2="430" y2="300" stroke="#1E293B" stroke-width="1.5"/><rect x="456" y="140" width="112" height="62" rx="10" fill="#0F1522" stroke="#26324A" stroke-width="1.5"/><rect x="456" y="152" width="3" height="38" rx="1.5" fill="#FFB547"/><text x="